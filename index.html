<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostafa & Amira wedding invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    background:url("firstpage.jpg") center/cover no-repeat;
}

/* طبقة تغميق خفيفة */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:0;
}


/* Envelope */
.envelope{
    position:relative;
    z-index:1;
    width:min(330px, 85vw);
    aspect-ratio:5/3.2;
    margin:auto;
}

.envelope-body{
    width:100%;
    height:100%;
    background:#0D5C5A;
    border-radius:4px;
    position:absolute;
}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:53%;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:#084846;
    z-index:2;
}


.seal img{
    width:300px;
    height:auto;
    display:block;
    object-fit:contain;
}

/* Tablet */
@media (max-width:768px){

    .envelope{
        width:min(300px, 88vw);
    }

    .seal img{
        width:250px;
    }
}

/* Mobile */
@media (max-width:480px){

    .envelope{
        width:85vw;
        max-width:260px;
    }

    .seal{
        top:36%;
    }

    .seal img{
        width:200px;
    }
}
.envelope{
    cursor:pointer;
    position:relative;
}

.flap{
    transform-origin:top center;
    transition:transform 1s ease; /* بدل 1.2s */
}

.seal{
    transition:opacity 0.2s ease;
}

/* عند الفتح */
.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .seal{
    opacity:0;
}

.envelope-wrapper{
    transform: translateY(120px);
    opacity: 0;
    animation: envelopeUp 1.2s ease forwards;
}

@keyframes envelopeUp{
    to{
        transform: translateY(0);
        opacity: 1;
    }
}
.main{
    transform: translateY(80px);
    opacity: 0;
    transition: 1s ease;
}

.main.show{
    transform: translateY(0);
    opacity: 1;
}
.seal{
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    cursor: pointer;
}

/* حالة الـ pop */
.seal.pop{
    animation: sealPop 0.8s ease forwards;
}

@keyframes sealPop{
    0%{
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
        opacity: 1;
    }

    40%{
        transform: translate(-50%, -60%) scale(1.3) rotate(10deg);
    }

    70%{
        transform: translate(-50%, -40%) scale(0.9) rotate(-8deg);
        opacity: 0.8;
    }

    100%{
        transform: translate(-50%, -120%) scale(0.2) rotate(20deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">

    <div class="envelope-body"></div>

    <div class="flap"></div>

    <div class="seal">
        <img src="seal.png" alt="Wax Seal">
    </div>

</div>

<script>
function openEnvelope() {

    const envelope = document.querySelector('.envelope');

    envelope.classList.add('open');

    setTimeout(() => {
        window.location.href = "main.html";
    }, 500); // بدل 1200ms

}
</script>
<script>
document.querySelector(".seal").addEventListener("click", function(){
    this.classList.add("pop");
});
</script>
</body>
</html>
