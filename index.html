<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mostafa & Amira wedding invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    background:url("firstpage.jpg") center/cover no-repeat;
}

/* طبقة تغميق خفيفة */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.25);
    z-index:0;
}


/* Envelope */
.envelope{
    position:relative;
    z-index:1;
    width:min(330px, 85vw);
    aspect-ratio:5/3.2;
    margin:auto;
}

.envelope-body{
    width:100%;
    height:100%;
    background:#0D5C5A;
    border-radius:4px;
    position:absolute;
}

.flap{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:53%;
    clip-path:polygon(0 0,100% 0,50% 100%);
    background:#084846;
    z-index:2;
}

.seal{
    position:absolute;
    top:15%;
    left:50%;
    transform:translateX(-50%);
    z-index:3;
}

.seal img{
    width:300px;
    height:auto;
    display:block;
    object-fit:contain;
}

/* Tablet */
@media (max-width:768px){

    .envelope{
        width:min(300px, 88vw);
    }

    .seal img{
        width:250px;
    }
}

/* Mobile */
@media (max-width:480px){

    .envelope{
        width:85vw;
        max-width:260px;
    }

    .seal{
        top:36%;
    }

    .seal img{
        width:200px;
    }
}
.envelope{
    cursor:pointer;
    position:relative;
}

.flap{
    transform-origin:top center;
    transition:transform 1s ease; /* بدل 1.2s */
}

.seal{
    transition:opacity 0.2s ease;
}

/* عند الفتح */
.envelope.open .flap{
    transform:rotateX(180deg);
}

.envelope.open .seal{
    opacity:0;
}
</style>
</head>

<body>

<div class="envelope" onclick="openEnvelope()">

    <div class="envelope-body"></div>

    <div class="flap"></div>

    <div class="seal">
        <img src="seal.png" alt="Wax Seal">
    </div>

</div>

<script>
function openEnvelope() {

    const envelope = document.querySelector('.envelope');

    envelope.classList.add('open');

    setTimeout(() => {
        window.location.href = "main.html";
    }, 500); // بدل 1200ms

}
</script>

</body>
</html>
