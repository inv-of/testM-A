<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>

/* ===== RESET ===== */
*{
    margin: 0;
    padding: 0;
    box-sizing:border-box;
    font-family: "Arial", sans-serif;
}

/* ===== HERO SECTION ===== */
.hero {
    width: 100%;
    height: 100vh;

    background-image: url("fsection.png"); /* 👈 حطي الصورة هنا */
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}




*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#f6f3f3;
}

.countdown-section{
    width:100%;
    min-height:auto;      /* مهم جداً */
    padding:80px 20px;    /* مساحة حوالين المحتوى */
    
    display:flex;
    justify-content:center;
    align-items:center;

    opacity:0;
    transform:translateY(80px);
    transition:all 1.2s ease;
}

.countdown-section.show{
    opacity:1;
    transform:translateY(0);
}

.countdown-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:fit-content;
}

.countdown-wrapper{
    display:flex;
    gap:18px;
}

.countdown-text{
    margin-top:40px;
    font-size:28px;
    letter-spacing:3px;
    color:#41402c;
    font-family:'Cinzel Decorative', serif;
    text-align:center;
}

.card{
    position:relative;
}

.string{
    position:absolute;
    width:3px;
    height:100px;
    background:#7A002C;
    left:50%;
    top:-100px;
    transform:translateX(-50%);
}

.card-inner{
    width:180px;
    height:250px;
    background:#7A002C;
    border-radius:22px;
    position:relative;
    overflow:hidden;
}

.hole{
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#f6f3f3;
    left:50%;
    top:14px;
    transform:translateX(-50%);
    z-index:10;
}

.middle-line{
    position:absolute;
    width:100%;
    height:3px;
    background:#f6f3f3;
    top:50%;
    transform:translateY(-50%);
    z-index:5;
}

.top,
.bottom{
    position:absolute;
    left:0;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;

    color:#fff;
    font-family:"Times New Roman", serif;
    font-size:220px;
    line-height:1;
}
.flip{
    animation:flip .6s ease;
}

@keyframes flip{
    0%{
        transform:rotateX(0);
    }
    50%{
        transform:rotateX(90deg);
    }
    100%{
        transform:rotateX(0);
    }
}

@media(max-width:768px){

    .card-inner{
        width:120px;
        height:180px;
    }

    .top,
    .bottom{
        font-size:130px;
    }

}
.dresscode-section{
    width: 100%;
    padding: 100px 20px;

    background-image: url("ssection.jpg"); 
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    position: relative;
    text-align: center;
    color: #fff;
}
.dresscode-section{
    opacity: 0;
    transform: translateY(60px);
    transition: 1s ease;
}

.dresscode-section.show{
    opacity: 1;
    transform: translateY(0);
}

.dresscode-content{
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: auto;
    color:#41402c;
}

.dresscode-content h2{
    font-size: 54px;
    margin-bottom: 20px;
    letter-spacing: 2px;
    color:#41402c;
    font-family: 'Great Vibes', cursive;
}

.dresscode-content p{
    font-size: 18px;
    line-height: 1.8;
    margin-bottom: 30px;
    color:#41402c;
    font-family: 'Cinzel Decorative', serif;
}

.dress-img{
    width: 550px;
    max-width: 80%;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
</style>
</head>

<body>

<!-- ===== HERO ===== -->
<section class="hero">
    
</section>

<section class="countdown-section">

    <div class="countdown-content">

        <div class="countdown-wrapper">

            <!-- الكارت الأول -->
            <div class="card">
                <div class="string"></div>

                <div class="card-inner">
                    <div class="hole"></div>
                    <div class="top" id="tens-top">0</div>
                    <div class="middle-line"></div>
                </div>
            </div>

            <!-- الكارت الثاني -->
            <div class="card">
                <div class="string"></div>

                <div class="card-inner">
                    <div class="hole"></div>
                    <div class="top" id="ones-top">0</div>
                    <div class="middle-line"></div>
                </div>
            </div>

        </div>

        <p class="countdown-text">
            Counting Down To Our Forever
        </p>

    </div>

</section>

<section class="dresscode-section">

    <div class="dresscode-content">

        <h2>Dress Code</h2>

        <p>
            We kindly ask our guests to dress in elegant formal attire to match the beauty of the occasion.
        </p>

        <img src="dresscode.jpg" alt="Dress Code Guide" class="dress-img">

    </div>

</section>

<script>

const targetDate = new Date("2026-06-18T00:00:00");

let oldDigits = ["0","0"];

function updateCountdown(){

    const now = new Date();

    const diff = targetDate - now;

    const days = Math.max(
        0,
        Math.ceil(diff / (1000*60*60*24))
    );

    const digits = String(days)
        .padStart(2,"0")
        .split("");

    const elements = [
        {
            top:document.getElementById("tens-top"),
            bottom:document.getElementById("tens-bottom"),
            value:digits[0]
        },
        {
            top:document.getElementById("ones-top"),
            bottom:document.getElementById("ones-bottom"),
            value:digits[1]
        }
    ];

    elements.forEach((el,index)=>{

        if(oldDigits[index] !== el.value){

            el.top.classList.remove("flip");
           

            void el.top.offsetWidth;

            el.top.classList.add("flip");
           

            el.top.textContent = el.value;
            

            oldDigits[index] = el.value;
        }

    });

}

updateCountdown();

setInterval(updateCountdown,1000);

</script>
<script>
window.addEventListener("scroll", function () {
    const section = document.querySelector(".countdown-section");
    const position = section.getBoundingClientRect().top;
    const screenHeight = window.innerHeight;

    if (position < screenHeight - 100) {
        section.classList.add("show");
    }
});
</script>
<script>
window.addEventListener("scroll", function () {

    const dressSection = document.querySelector(".dresscode-section");
    const position = dressSection.getBoundingClientRect().top;
    const screenHeight = window.innerHeight;

    if (position < screenHeight - 100) {
        dressSection.classList.add("show");
    }

});
</script>
<script>

const countdownSection =
document.querySelector(".countdown-section");

const observer = new IntersectionObserver((entries)=>{

    entries.forEach((entry)=>{

        if(entry.isIntersecting){
            entry.target.classList.add("show");
        }

    });

},{
    threshold:0.2
});

observer.observe(countdownSection);

</script>
</body>
</html>
